[package]
name = "xdf"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Garfield100/xdf_rs"
exclude = ["example-files", ".*", "/fuzz"]
description = "Read XDF Files"
keywords = [
    "XDF",
    "EEG",
] # this file format is commonly output by electroencephalogram recorders
categories = ["parser-implementations", "science::neuroscience"]


[dependencies]
nom = "7.1.3"
strict-num = { version = "0.2.0", default-features = false }
thiserror = "2.0.12"
tracing = { version = "0.1.41", optional = true }
xmltree = "0.11.0"
zerocopy = "0.8.25"

[dev-dependencies]
criterion = "0.6.0"
# used here to create differently-named tests from a generic function without having to use a whole proc-macro.
paste = "1.0.15"
test-log = { version = "0.2.17", features = ["trace"] }

[features]
default = ["write"]
write = []
tracing = ["dep:tracing"]


[profile.profiler]
inherits = "release"
debug = true
strip = "none"

# criterion wants the following:
[lib]
bench = false

[[bench]]
name = "parse_files"
harness = false
